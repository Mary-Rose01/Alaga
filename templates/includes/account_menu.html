<details class="account-menu">
    <summary class="account-trigger btn btn-secondary btn-sm">
        <span class="user-details">
            <span class="user-role">{{ user.role|default:"Staff" }}</span>
            <span class="user-name">{{ user.username }}</span>
        </span>
        <span class="account-chevron" aria-hidden="true"></span>
    </summary>
    <div class="account-dropdown">
        <a href="{% url 'home' %}" class="dropdown-link{% if request.resolver_match.url_name == 'home' %} is-active{% endif %}">Dashboard</a>
        <a href="{% url 'profile' %}" class="dropdown-link{% if request.resolver_match.url_name == 'profile' %} is-active{% endif %}">Profile</a>
        <a href="{% url 'settings' %}" class="dropdown-link{% if request.resolver_match.url_name == 'settings' %} is-active{% endif %}">Settings</a>
        <form method="POST" action="{% url 'logout' %}" class="dropdown-form">
            {% csrf_token %}
            <button type="submit" class="dropdown-link dropdown-signout">Sign Out</button>
        </form>
    </div>
</details>
